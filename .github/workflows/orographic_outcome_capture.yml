name: Orographic Outcome Capture

on:
  workflow_dispatch:
    inputs:
      scheduled_time_utc:
        description: "Cloudflare scheduler timestamp used to measure dispatch delay"
        required: false
        type: string
      scheduler:
        description: "Dispatch authority"
        required: false
        type: string
  # Cloudflare's durable cron dispatcher invokes this workflow hourly at :18
  # during the Chicago market session. Keeping a single timing
  # authority avoids duplicate jobs and GitHub schedule jitter.

concurrency:
  group: orographic-research-write-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      OROGRAPHIC_RESEARCH_R2_BUCKET: ${{ secrets.OROGRAPHIC_RESEARCH_R2_BUCKET }}
      TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
      OROGRAPHIC_TRADIER_ACCESS_TOKEN: ${{ secrets.OROGRAPHIC_TRADIER_ACCESS_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
      TRADIER_SANDBOX_MODE: ${{ secrets.TRADIER_SANDBOX_MODE }}
      PYTHONPATH: .
    steps:
      - name: Record capture start time
        id: capture_start
        run: echo "started_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync latest serialized research state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Require durable operational storage
        run: |
          if [ -z "${OROGRAPHIC_RESEARCH_R2_BUCKET}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_R2_API_TOKEN}" ]; then
            echo "Operational capture requires OROGRAPHIC_RESEARCH_R2_BUCKET, CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_R2_API_TOKEN." >&2
            exit 1
          fi

      - name: Set up Node for R2 and Pages
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore mutable research ledgers from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          python scripts/sync_operational_ledgers_r2.py pull \
            --bucket "${OROGRAPHIC_RESEARCH_R2_BUCKET}" \
            --allow-missing

      - name: Check Tradier capture configuration
        id: capture_config
        run: |
          if [ -n "${TRADIER_ACCESS_TOKEN}" ] || [ -n "${OROGRAPHIC_TRADIER_ACCESS_TOKEN}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture prospective trajectories and outcome windows
        id: capture_prospective
        if: ${{ steps.capture_config.outputs.configured == 'true' }}
        continue-on-error: true
        run: |
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/prospective_pick_ledger.json \
            --ignore-missing

      - name: Capture moonshot trajectories and outcome windows
        id: capture_moonshot
        if: ${{ steps.capture_config.outputs.configured == 'true' }}
        continue-on-error: true
        run: |
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/moonshot_prospective_ledger.json \
            --ignore-missing

      - name: Refresh challenger evidence
        id: refresh_evidence
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f web/data/diagnostics/prospective_pick_ledger.json ]; then
            python scripts/build_scout_pair_readiness.py --warn-only
            python scripts/build_payoff_challenger_evidence.py
            python scripts/build_counterfactual_veto_evidence.py
            python scripts/evaluate_exit_policy_shadow.py
            python scripts/mark_path_outcomes_from_archive.py \
              --archive-dir engine/data/live_options_archive \
              --ledger web/data/diagnostics/prospective_pick_ledger.json \
              --ledger web/data/diagnostics/moonshot_prospective_ledger.json
          fi

      - name: Build capture health and governance artifacts
        if: ${{ always() }}
        run: |
          python scripts/build_outcome_capture_health.py \
            --token-configured "${{ steps.capture_config.outputs.configured }}" \
            --prospective-step-status "${{ steps.capture_prospective.outcome }}" \
            --moonshot-step-status "${{ steps.capture_moonshot.outcome }}" \
            --evidence-step-status "${{ steps.refresh_evidence.outcome }}" \
            --scheduled-at-utc "${{ inputs.scheduled_time_utc }}" \
            --workflow-started-at-utc "${{ steps.capture_start.outputs.started_at_utc }}" \
            --scheduler "${{ inputs.scheduler || 'manual' }}" \
            --output web/data/diagnostics/outcome_capture_health_latest.json
          python scripts/build_model_governance_summary.py \
            --capture-health web/data/diagnostics/outcome_capture_health_latest.json
          python scripts/build_rebuild_readiness.py

      - name: Build compact dashboard prospective summary
        if: ${{ always() }}
        run: |
          python scripts/build_dashboard_prospective_summary.py

      - name: Publish mutable research ledgers to R2
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          python scripts/sync_operational_ledgers_r2.py push \
            --bucket "${OROGRAPHIC_RESEARCH_R2_BUCKET}"

      - name: Deploy refreshed capture evidence to Cloudflare Pages
        if: ${{ always() && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          python scripts/build_pages_bundle.py
          npx wrangler pages deploy output/pages_bundle \
            --project-name orographic \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "outcome capture evidence (${GITHUB_REF_NAME})"

      - name: Surface capture-health alert
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/diagnostics/outcome_capture_health_latest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("alert_required"):
              failed = ", ".join(row.get("name", "unknown") for row in report.get("alert_checks", report.get("failed_checks", [])))
              raise SystemExit(f"Outcome capture requires attention: {failed}")
          if report.get("status") == "degraded":
              degraded = ", ".join(row.get("name", "unknown") for row in report.get("failed_checks", []))
              print(f"::warning::Outcome capture degraded without paging: {degraded}")
          else:
              print("Outcome capture health passed.")
          PY
