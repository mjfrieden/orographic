name: Orographic Outcome Capture

on:
  workflow_dispatch:
  schedule:
    # Covers US market hours across daylight/standard time. The marker captures
    # fresh trajectories for active contracts and strict fixed-exit windows.
    - cron: "*/15 13-22 * * 1-5"

concurrency:
  group: orographic-research-write-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
      OROGRAPHIC_TRADIER_ACCESS_TOKEN: ${{ secrets.OROGRAPHIC_TRADIER_ACCESS_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
      TRADIER_SANDBOX_MODE: ${{ secrets.TRADIER_SANDBOX_MODE }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync latest serialized research state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Check Tradier capture configuration
        id: capture_config
        run: |
          if [ -n "${TRADIER_ACCESS_TOKEN}" ] || [ -n "${OROGRAPHIC_TRADIER_ACCESS_TOKEN}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture prospective trajectories and outcome windows
        id: capture_prospective
        if: ${{ steps.capture_config.outputs.configured == 'true' }}
        continue-on-error: true
        run: |
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/prospective_pick_ledger.json \
            --ignore-missing

      - name: Capture moonshot trajectories and outcome windows
        id: capture_moonshot
        if: ${{ steps.capture_config.outputs.configured == 'true' }}
        continue-on-error: true
        run: |
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/moonshot_prospective_ledger.json \
            --ignore-missing

      - name: Refresh challenger evidence
        id: refresh_evidence
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f web/data/diagnostics/prospective_pick_ledger.json ]; then
            python scripts/build_scout_pair_readiness.py --warn-only
            python scripts/build_payoff_challenger_evidence.py
            python scripts/build_counterfactual_veto_evidence.py
            python scripts/mark_path_outcomes_from_archive.py \
              --archive-dir engine/data/live_options_archive \
              --ledger web/data/diagnostics/prospective_pick_ledger.json \
              --ledger web/data/diagnostics/moonshot_prospective_ledger.json
          fi

      - name: Build capture health and governance artifacts
        if: ${{ always() }}
        run: |
          python scripts/build_outcome_capture_health.py \
            --token-configured "${{ steps.capture_config.outputs.configured }}" \
            --prospective-step-status "${{ steps.capture_prospective.outcome }}" \
            --moonshot-step-status "${{ steps.capture_moonshot.outcome }}" \
            --evidence-step-status "${{ steps.refresh_evidence.outcome }}" \
            --output web/data/diagnostics/outcome_capture_health_latest.json
          python scripts/build_model_governance_summary.py \
            --capture-health web/data/diagnostics/outcome_capture_health_latest.json

      - name: Persist new research evidence
        id: persist_evidence
        if: ${{ always() }}
        run: |
          git config user.name "orographic-research-bot"
          git config user.email "orographic-research-bot@users.noreply.github.com"
          git add \
            web/data/diagnostics/prospective_pick_ledger.json \
            web/data/diagnostics/moonshot_prospective_ledger.json \
            web/data/diagnostics/scout_pair_readiness_latest.json \
            web/data/diagnostics/payoff_challenger_evidence_latest.json \
            web/data/diagnostics/counterfactual_veto_evidence_latest.json \
            web/data/diagnostics/outcome_capture_health_latest.json \
            web/data/diagnostics/model_governance_summary_latest.json
          if git diff --cached --quiet; then
            echo "No capture state changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: capture prospective option outcomes"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if [ "$attempt" -eq 3 ]; then
                echo "Capture evidence push failed after ${attempt} attempts." >&2
                exit 1
              fi
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for refreshed dashboard deploy
        if: ${{ always() && steps.persist_evidence.outputs.changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy refreshed capture evidence to Cloudflare Pages
        if: ${{ always() && steps.persist_evidence.outputs.changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          npx wrangler pages deploy web \
            --project-name orographic \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "outcome capture evidence (${GITHUB_REF_NAME})"

      - name: Surface capture-health alert
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/diagnostics/outcome_capture_health_latest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("alert_required"):
              failed = ", ".join(row.get("name", "unknown") for row in report.get("failed_checks", []))
              raise SystemExit(f"Outcome capture requires attention: {failed}")
          print("Outcome capture health passed.")
          PY
