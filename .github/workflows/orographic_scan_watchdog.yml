name: Orographic Scan Watchdog

on:
  workflow_dispatch:
  schedule:
    # Dispatch a fallback scan if the Cloudflare cron did not create its run.
    - cron: "25 14,17,20 * * 1-5"

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scan watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/orographic_scan_watchdog.py \
            --workflow-file orographic_scan.yml \
            --branch main \
            --ref main \
            --grace-minutes 15
