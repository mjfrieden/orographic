name: Deploy Orographic Scan Dispatcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy_scan_dispatcher.yml"
      - "workers/scan-dispatcher/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate required secrets
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.OROGRAPHIC_CRON_GITHUB_TOKEN }}
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${GITHUB_DISPATCH_TOKEN}"

      - name: Configure GitHub dispatch secret
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.OROGRAPHIC_CRON_GITHUB_TOKEN }}
        run: |
          printf '%s' "${GITHUB_DISPATCH_TOKEN}" | npx wrangler secret put GITHUB_DISPATCH_TOKEN \
            --config workers/scan-dispatcher/wrangler.jsonc

      - name: Deploy Cloudflare cron dispatcher
        run: |
          npx wrangler deploy --config workers/scan-dispatcher/wrangler.jsonc
