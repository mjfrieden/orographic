name: Orographic Scan

on:
  workflow_dispatch:
  schedule:
    # 14:07, 17:07, and 20:07 UTC on weekdays.
    # This is 9:07 AM, 12:07 PM, and 3:07 PM in America/Chicago during daylight saving time.
    - cron: "7 14,17,20 * * 1-5"

concurrency:
  group: orographic-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      OROGRAPHIC_INTERNAL_CAPTURE_TOKEN: ${{ secrets.OROGRAPHIC_INTERNAL_CAPTURE_TOKEN }}
      OROGRAPHIC_SENTINEL_URL: ${{ secrets.OROGRAPHIC_SENTINEL_URL }}
      OROGRAPHIC_RESEARCH_R2_BUCKET: ${{ secrets.OROGRAPHIC_RESEARCH_R2_BUCKET }}
      OROGRAPHIC_SEC_USER_AGENT: ${{ secrets.OROGRAPHIC_SEC_USER_AGENT }}
      OROGRAPHIC_EVENT_FEATURES_PATH: engine/data/event_observatory/daily_event_features.parquet
      OROGRAPHIC_SITE_URL: https://orographic.pages.dev
      TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
      OROGRAPHIC_TRADIER_ACCESS_TOKEN: ${{ secrets.OROGRAPHIC_TRADIER_ACCESS_TOKEN }}
      TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
      TRADIER_SANDBOX_MODE: ${{ secrets.TRADIER_SANDBOX_MODE }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          pip install pytest

      - name: Run regression gates
        run: |
          python -m pytest -q engine/tests
          python scripts/validate_model_artifacts.py

      - name: Restore rolling Event Observatory
        uses: actions/cache@v4
        with:
          path: engine/data/event_observatory
          key: orographic-event-observatory-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            orographic-event-observatory-${{ runner.os }}-

      - name: Collect timestamped event observations
        run: |
          EVENT_DATE="$(date -u +%F)"
          mkdir -p engine/data/event_observatory/raw
          if [ -n "${OROGRAPHIC_SEC_USER_AGENT}" ]; then
            python scripts/fetch_sec_filings.py \
              --start-date "${EVENT_DATE}" \
              --end-date "${EVENT_DATE}" \
              --snapshot web/data/latest_run.json \
              --output engine/data/event_observatory/raw/sec_latest.csv \
              --observatory-output engine/data/event_observatory/event_observatory.parquet \
              --continue-on-error
          else
            echo "OROGRAPHIC_SEC_USER_AGENT is not configured; skipping SEC collection."
          fi
          python scripts/fetch_gdelt_macro.py \
            --start-date "${EVENT_DATE}" \
            --end-date "${EVENT_DATE}" \
            --max-records-per-day 25 \
            --resume \
            --continue-on-error \
            --output engine/data/event_observatory/raw/gdelt_macro.csv \
            --observatory-output engine/data/event_observatory/event_observatory.parquet
          python scripts/fetch_gdelt_company_news.py \
            --start-date "${EVENT_DATE}" \
            --end-date "${EVENT_DATE}" \
            --universe-file engine/sample_universe.txt \
            --aliases engine/company_aliases.json \
            --batch-size 20 \
            --max-records-per-batch 50 \
            --pause-seconds 2 \
            --max-retries 1 \
            --retry-base-seconds 10 \
            --resume \
            --continue-on-error \
            --output engine/data/event_observatory/raw/gdelt_company_news.csv \
            --health-output engine/data/event_observatory/gdelt_company_news_health.json \
            --review-queue engine/data/event_observatory/review/headline_review_queue.jsonl \
            --observatory-output engine/data/event_observatory/event_observatory.parquet
          python scripts/fetch_company_ir_feeds.py \
            --feeds engine/company_ir_feeds.json \
            --output engine/data/event_observatory/raw/company_ir_latest.csv \
            --health-output engine/data/event_observatory/company_ir_feed_health.json \
            --review-queue engine/data/event_observatory/review/headline_review_queue.jsonl \
            --observatory-output engine/data/event_observatory/event_observatory.parquet
          python scripts/build_event_features.py \
            --observatory-input engine/data/event_observatory/event_observatory.parquet \
            --output engine/data/event_observatory/daily_event_features.parquet \
            --replace

      - name: Mark pending prospective outcomes before scan
        if: ${{ env.TRADIER_ACCESS_TOKEN != '' || env.OROGRAPHIC_TRADIER_ACCESS_TOKEN != '' }}
        run: |
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/prospective_pick_ledger.json \
            --ignore-missing
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/moonshot_prospective_ledger.json \
            --ignore-missing

      - name: Run Orographic scan
        run: |
          python engine/run_scan.py --output web/data/latest_run.json

      - name: Archive live option chains
        run: |
          python scripts/archive_live_option_chains.py \
            --snapshot web/data/latest_run.json \
            --minimum-universe-symbols 60 \
            --output-dir engine/data/live_options_archive

      - name: Mark due prospective pick outcomes
        if: ${{ env.TRADIER_ACCESS_TOKEN != '' || env.OROGRAPHIC_TRADIER_ACCESS_TOKEN != '' }}
        run: |
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/prospective_pick_ledger.json \
            --ignore-missing
          python engine/mark_prospective_outcomes.py \
            --ledger web/data/diagnostics/moonshot_prospective_ledger.json \
            --ignore-missing

      - name: Mark archived quote path outcomes
        run: |
          python scripts/mark_path_outcomes_from_archive.py \
            --archive-dir engine/data/live_options_archive \
            --ledger web/data/diagnostics/prospective_pick_ledger.json \
            --ledger web/data/diagnostics/moonshot_prospective_ledger.json

      - name: Build research datasets
        run: |
          python scripts/build_research_datasets.py \
            --prospective-ledger web/data/diagnostics/prospective_pick_ledger.json \
            --moonshot-ledger web/data/diagnostics/moonshot_prospective_ledger.json \
            --output-dir output/research_datasets

      - name: Build point-in-time event outcome coverage
        run: |
          python scripts/build_event_outcome_coverage.py \
            --observatory engine/data/event_observatory/event_observatory.parquet \
            --outcomes output/research_datasets/all_recommendation_outcomes.parquet \
            --output output/research_datasets/event_enriched_option_outcomes.parquet \
            --report-output output/research_datasets/event_outcome_coverage.json

      - name: Evaluate event feature promotion readiness
        run: |
          python scripts/evaluate_event_scout_ablation.py \
            --input output/research_datasets/event_enriched_option_outcomes.parquet \
            --output output/research_datasets/event_scout_ablation.json

      - name: Audit research data capture
        run: |
          MIN_ARCHIVE_ROWS="$(python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("web/data/latest_run.json").read_text(encoding="utf-8"))
          regime = payload.get("regime") if isinstance(payload.get("regime"), dict) else {}
          scout_count = len(payload.get("scout_signals", [])) if isinstance(payload.get("scout_signals"), list) else 0
          forge_count = len(payload.get("forge_candidates", [])) if isinstance(payload.get("forge_candidates"), list) else 0
          print(0 if regime.get("mode") == "extreme_vol" and scout_count == 0 and forge_count == 0 else 1)
          PY
          )"
          python scripts/audit_research_data_capture.py \
            --live-archive-manifest engine/data/live_options_archive/coverage_manifest.json \
            --prospective-ledger web/data/diagnostics/prospective_pick_ledger.json \
            --moonshot-ledger web/data/diagnostics/moonshot_prospective_ledger.json \
            --research-dataset-dir output/research_datasets \
            --min-archive-rows "${MIN_ARCHIVE_ROWS}" \
            --event-quality-report engine/data/event_observatory/event_observatory.parquet.quality.json \
            --event-coverage-report output/research_datasets/event_outcome_coverage.json \
            --event-enriched-dataset output/research_datasets/event_enriched_option_outcomes.parquet \
            --event-feed-health engine/data/event_observatory/gdelt_company_news_health.json \
            --output output/research_datasets/research_data_capture_audit.json

      - name: Sync dashboard validation artifacts
        run: |
          python scripts/sync_dashboard_artifacts.py

      - name: Validate refreshed snapshot
        run: |
          python scripts/validate_model_artifacts.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path("web/data/latest_run.json").read_text(encoding="utf-8"))
          if payload.get("error"):
              raise SystemExit(f"snapshot contains pipeline error: {payload.get('error')}")
          summary = payload.get("summary", {})
          regime = payload.get("regime") if isinstance(payload.get("regime"), dict) else {}
          scout_signal_count = int(summary.get("scout_signal_count", 0) or 0)
          extreme_vol_abstain = regime.get("mode") == "extreme_vol" and scout_signal_count == 0
          if scout_signal_count <= 0 and not extreme_vol_abstain:
              raise SystemExit("snapshot has no Scout signals")
          council = payload.get("council", {})
          council_summary = council.get("summary", {})
          if summary.get("scout_signal_count") != len(payload.get("scout_signals", [])):
              raise SystemExit("snapshot scout signal count does not match stored rows")
          if summary.get("forge_candidate_count") != len(payload.get("forge_candidates", [])):
              raise SystemExit("snapshot forge candidate count does not match stored rows")
          if council_summary.get("candidate_count") != len(payload.get("forge_candidates", [])):
              raise SystemExit("council candidate count does not match forge candidates")
          if council_summary.get("live_count") != len(council.get("live_board", [])):
              raise SystemExit("council live count does not match live board")
          if council_summary.get("shadow_count") != len(council.get("shadow_board", [])):
              raise SystemExit("council shadow count does not match shadow board")
          artifacts = payload.get("model_artifacts", {})
          optional_artifacts = {"path_model", "path_model_card"}
          missing = [
              name
              for name, row in artifacts.items()
              if name not in optional_artifacts and (not row.get("present") or not row.get("sha256"))
          ]
          if missing:
              raise SystemExit(f"snapshot missing model artifact status: {missing}")
          ledger = Path("web/data/diagnostics/side_aware_scout_shadow_ledger.json")
          if not ledger.exists():
              raise SystemExit("side-aware Scout shadow ledger was not written")
          prospective_ledger = Path("web/data/diagnostics/prospective_pick_ledger.json")
          if not prospective_ledger.exists():
              raise SystemExit("prospective pick ledger was not written")
          moonshot_ledger = Path("web/data/diagnostics/moonshot_prospective_ledger.json")
          if not moonshot_ledger.exists():
              raise SystemExit("moonshot prospective ledger was not written")
          live_archive_manifest = Path("engine/data/live_options_archive/coverage_manifest.json")
          if not live_archive_manifest.exists():
              raise SystemExit("live option-chain archive manifest was not written")
          research_dataset = Path("output/research_datasets/all_recommendation_outcomes.parquet")
          if not research_dataset.exists():
              raise SystemExit("research dataset artifact was not written")
          attribution = payload.get("attribution", {})
          if attribution.get("artifact") != "live_shadow_attribution":
              raise SystemExit("snapshot attribution artifact missing")
          attribution_file = Path("web/data/diagnostics/live_shadow_attribution_latest.json")
          if not attribution_file.exists():
              raise SystemExit("live/shadow attribution artifact was not written")
          board_history = Path("web/data/diagnostics/board_recommendation_history.json")
          if not board_history.exists():
              raise SystemExit("board recommendation history was not written")
          walk_forward = Path("web/data/walk_forward_results.json")
          if not walk_forward.exists():
              raise SystemExit("walk-forward dashboard artifact was not written")
          walk_forward_payload = json.loads(walk_forward.read_text(encoding="utf-8"))
          if int(walk_forward_payload.get("total_trades", 0)) <= 0:
              raise SystemExit("walk-forward dashboard artifact is empty")
          if not str(walk_forward_payload.get("variant_key") or "").strip():
              raise SystemExit("walk-forward dashboard artifact is missing variant_key")
          backtest = Path("web/data/backtest_results.json")
          if not backtest.exists():
              raise SystemExit("backtest dashboard artifact was not written")
          backtest_payload = json.loads(backtest.read_text(encoding="utf-8"))
          if int(backtest_payload.get("total_trades", 0)) <= 0:
              raise SystemExit("backtest dashboard artifact is empty")
          print("Snapshot regression gates passed.")
          PY

      - name: Commit refreshed snapshot
        id: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest_run.json web/data/diagnostics/ web/data/walk_forward_results.json web/data/backtest_results.json
          if git diff --cached --quiet; then
            echo "snapshot_changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Orographic snapshot"
          echo "snapshot_changed=true" >> "$GITHUB_OUTPUT"

      - name: Push refreshed snapshot to GitHub
        id: push_snapshot
        if: ${{ steps.snapshot.outputs.snapshot_changed == 'true' }}
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Snapshot push succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Snapshot push failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "Retrying snapshot push in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

      - name: Set up Node
        if: ${{ steps.snapshot.outputs.snapshot_changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy refreshed snapshot to Cloudflare Pages
        id: deploy_pages
        if: ${{ steps.snapshot.outputs.snapshot_changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          npx wrangler pages deploy web \
            --project-name orographic \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "snapshot refresh (${GITHUB_REF_NAME})"

      - name: Capture hosted position snapshot
        id: capture_positions
        if: ${{ env.OROGRAPHIC_INTERNAL_CAPTURE_TOKEN != '' }}
        continue-on-error: true
        run: |
          RUN_GENERATED_AT_UTC="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('web/data/latest_run.json').read_text(encoding='utf-8'))
          print(payload.get('generated_at_utc', ''))
          PY
          )"
          export RUN_GENERATED_AT_UTC
          python - <<'PY' > /tmp/orographic-position-capture.json
          import json
          import os
          print(json.dumps({
              "run_generated_at_utc": os.environ.get("RUN_GENERATED_AT_UTC", ""),
              "source": "github_actions_orographic_scan",
          }))
          PY
          curl --fail --show-error --silent \
            --request POST \
            --url "${OROGRAPHIC_SITE_URL}/api/internal/positions/capture" \
            --header "Authorization: Bearer ${OROGRAPHIC_INTERNAL_CAPTURE_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @/tmp/orographic-position-capture.json

      - name: Set up Node for R2 research export
        if: ${{ env.OROGRAPHIC_RESEARCH_R2_BUCKET != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_R2_API_TOKEN != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Upload research data to R2
        id: upload_r2
        if: ${{ env.OROGRAPHIC_RESEARCH_R2_BUCKET != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_R2_API_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
        run: |
          python scripts/upload_research_artifacts_to_r2.py \
            --bucket "${OROGRAPHIC_RESEARCH_R2_BUCKET}" \
            engine/data/live_options_archive \
            engine/data/event_observatory \
            output/research_datasets

      - name: Write scan health summary
        if: ${{ always() }}
        run: |
          python scripts/build_scan_health_summary.py \
            --output web/data/diagnostics/scan_health_summary_latest.json \
            --r2-status "${{ steps.upload_r2.outcome || 'skipped' }}" \
            --dashboard-push-status "${{ steps.push_snapshot.outcome || 'skipped' }}" \
            --dashboard-deploy-status "${{ steps.deploy_pages.outcome || 'skipped' }}" \
            --warn-only

      - name: Commit scan health summary
        id: health_summary
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/diagnostics/scan_health_summary_latest.json
          if git diff --cached --quiet; then
            echo "health_summary_changed=false" >> "$GITHUB_OUTPUT"
            echo "No scan health summary changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Orographic scan health summary"
          echo "health_summary_changed=true" >> "$GITHUB_OUTPUT"

      - name: Push scan health summary to GitHub
        id: push_health_summary
        if: ${{ always() && steps.health_summary.outputs.health_summary_changed == 'true' }}
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Scan health summary push succeeded on attempt ${attempt}."
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Scan health summary push failed after ${attempt} attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "Retrying scan health summary push in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done

      - name: Deploy scan health summary to Cloudflare Pages
        id: deploy_health_summary
        if: ${{ always() && steps.health_summary.outputs.health_summary_changed == 'true' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          npx wrangler pages deploy web \
            --project-name orographic \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "scan health summary refresh (${GITHUB_REF_NAME})"

      - name: Upload live research data artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: orographic-live-research-data
          path: |
            engine/data/live_options_archive/
            engine/data/event_observatory/
            output/research_datasets/
          retention-days: 90

      - name: Fail when snapshot push did not reach GitHub
        if: ${{ steps.snapshot.outputs.snapshot_changed == 'true' && steps.push_snapshot.outcome == 'failure' }}
        run: |
          echo "Snapshot deploy completed, but GitHub push never succeeded." >&2
          exit 1

      - name: Fail when Cloudflare Pages deploy failed
        if: ${{ steps.deploy_pages.outcome == 'failure' }}
        run: |
          echo "Snapshot was built, but Cloudflare Pages deploy failed." >&2
          exit 1

      - name: Fail when scan health summary push did not reach GitHub
        if: ${{ steps.health_summary.outputs.health_summary_changed == 'true' && steps.push_health_summary.outcome == 'failure' }}
        run: |
          echo "Scan health summary was written, but GitHub push never succeeded." >&2
          exit 1

      - name: Fail when scan health summary Cloudflare Pages deploy failed
        if: ${{ steps.deploy_health_summary.outcome == 'failure' }}
        run: |
          echo "Scan health summary was built, but Cloudflare Pages deploy failed." >&2
          exit 1

      - name: Fail when R2 research archival failed
        if: ${{ steps.upload_r2.outcome == 'failure' }}
        run: |
          echo "Dashboard refresh completed, but R2 research archival failed." >&2
          exit 1
