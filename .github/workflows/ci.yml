name: Orographic CI

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "engine/**"
      - "functions/**"
      - "tests/js/**"
      - "package.json"
      - "scripts/**"
      - "web/**"
      - "README.md"
      - "docs/**"

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          pip install pytest

      - name: Validate model artifacts
        run: |
          python scripts/validate_model_artifacts.py

      - name: Run tests
        run: |
          python -m pytest -q engine/tests

      - name: Run JS/API tests
        run: |
          npm run test:js

      - name: Snapshot smoke test
        run: |
          python engine/run_scan.py \
            --symbols SPY,QQQ,IWM,DIA,GLD,SLV \
            --output /tmp/orographic_ci_latest.json \
            --prospective-ledger-output /tmp/orographic_ci_prospective_ledger.json \
            --shadow-ledger-output /tmp/orographic_ci_shadow_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/orographic_ci_latest.json").read_text(encoding="utf-8"))
          if payload.get("error"):
              raise SystemExit(f"snapshot contains pipeline error: {payload.get('error')}")
          summary = payload.get("summary", {})
          if summary.get("scout_signal_count", 0) <= 0:
              raise SystemExit("snapshot smoke test produced no Scout signals")
          council = payload.get("council", {})
          council_summary = council.get("summary", {})
          if summary.get("scout_signal_count") != len(payload.get("scout_signals", [])):
              raise SystemExit("snapshot scout signal count does not match stored rows")
          if summary.get("forge_candidate_count") != len(payload.get("forge_candidates", [])):
              raise SystemExit("snapshot forge candidate count does not match stored rows")
          if council_summary.get("candidate_count") != len(payload.get("forge_candidates", [])):
              raise SystemExit("council candidate count does not match forge candidates")
          if council_summary.get("live_count") != len(council.get("live_board", [])):
              raise SystemExit("council live count does not match live board")
          if council_summary.get("shadow_count") != len(council.get("shadow_board", [])):
              raise SystemExit("council shadow count does not match shadow board")
          ledger = json.loads(Path("/tmp/orographic_ci_shadow_ledger.json").read_text(encoding="utf-8"))
          if ledger.get("artifact") != "side_aware_scout_shadow_ledger":
              raise SystemExit("shadow ledger artifact was not written")
          prospective = json.loads(Path("/tmp/orographic_ci_prospective_ledger.json").read_text(encoding="utf-8"))
          if prospective.get("artifact") != "prospective_pick_ledger":
              raise SystemExit("prospective pick ledger artifact was not written")
          attribution = payload.get("attribution", {})
          if attribution.get("artifact") != "live_shadow_attribution":
              raise SystemExit("snapshot attribution artifact missing")
          attribution_path = Path("/tmp/diagnostics/live_shadow_attribution_latest.json")
          if not attribution_path.exists():
              raise SystemExit("live/shadow attribution artifact was not written")
          board_history = Path("/tmp/diagnostics/board_recommendation_history.json")
          if not board_history.exists():
              raise SystemExit("board recommendation history was not written")
          artifacts = payload.get("model_artifacts", {})
          missing = [
              name
              for name, row in artifacts.items()
              if row.get("required", True) and (not row.get("present") or not row.get("sha256"))
          ]
          if missing:
              raise SystemExit(f"snapshot missing model artifact status: {missing}")
          print("Snapshot smoke test passed.")
          PY
