name: Orographic CI

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "engine/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements-mart.txt
          pip install pytest

      - name: Validate model artifacts
        run: |
          python scripts/validate_model_artifacts.py

      - name: Run tests
        run: |
          python -m pytest -q engine/tests

      - name: Snapshot smoke test
        run: |
          python engine/run_scan.py \
            --output /tmp/orographic_ci_latest.json \
            --prospective-ledger-output /tmp/orographic_ci_prospective_ledger.json \
            --shadow-ledger-output /tmp/orographic_ci_shadow_ledger.json
          python scripts/validate_snapshot_smoke.py \
            --snapshot /tmp/orographic_ci_latest.json \
            --shadow-ledger /tmp/orographic_ci_shadow_ledger.json \
            --prospective-ledger /tmp/orographic_ci_prospective_ledger.json \
            --diagnostics-dir /tmp/diagnostics
