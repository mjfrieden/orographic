name: Orographic CI

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "engine/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - "functions/**"
      - "web/**"
      - "tests/js/**"
      - "workers/**"
      - "package.json"

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run mocked JavaScript regression tests
        run: npm run test:js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements-mart.txt
          pip install pytest

      - name: Validate model artifacts
        run: |
          python scripts/validate_model_artifacts.py

      - name: Run tests
        run: |
          python -m pytest -q engine/tests

      - name: Run observation tooling tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Offline snapshot smoke test
        # Synthetic providers; actual CLI, writers and snapshot validator.
        # Keep the independent real-model hash gate above unchanged.
        run: python -m pytest -q engine/tests/test_offline_snapshot_cli.py
