name: Deploy Orographic Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "functions/**"
      - "scripts/build_pages_bundle.py"
      - "wrangler.toml"
      - ".github/workflows/deploy_pages.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Require Cloudflare deploy secrets
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Pages UI deploys require CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      - name: Stage Pages bundle
        run: python scripts/build_pages_bundle.py

      - name: Deploy Cloudflare Pages
        run: |
          npx wrangler pages deploy output/pages_bundle \
            --project-name orographic \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "$(git rev-parse HEAD)" \
            --commit-message "ui/functions deploy (${GITHUB_REF_NAME})"
